<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050807">
    <title>Attendance Manager | C11 + WebAssembly</title>
    <meta name="description" content="A C11 student attendance manager running locally in the browser through WebAssembly.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="signal-field" aria-hidden="true">
        <span class="signal-grid"></span>
        <span class="signal-node node-one"></span>
        <span class="signal-node node-two"></span>
        <span class="signal-node node-three"></span>
    </div>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <div id="app-container">
        <header id="app-header">
            <div class="brand">
                <span class="eyebrow">C11 / EMSCRIPTEN / IDBFS</span>
                <h1>Attendance Manager</h1>
                <p class="subtitle">A small native-style application, running in the browser.</p>
            </div>
            <div class="status-bar" aria-label="Application status">
                <span class="status-ready">READY</span>
            </div>
        </header>

        <main id="terminal-area">
            <div class="terminal-heading">
                <span><span class="terminal-dot" aria-hidden="true"></span> SESSION CONSOLE</span>
                <span class="terminal-hint">LOCAL STORAGE ENABLED</span>
            </div>
            <div class="terminal-frame">
                <textarea id="output" readonly rows="24" cols="80" aria-label="Terminal output"></textarea>
                <div id="input-area">
                    <label for="input" class="sr-only">Enter a command</label>
                    <span class="prompt" aria-hidden="true">&gt;_</span>
                    <input type="text" id="input" autofocus autocomplete="off" spellcheck="false" aria-label="Enter a command" placeholder="Waiting for input...">
                </div>
            </div>
        </main>

        <footer id="app-footer">
            <span>Data stays in this browser</span>
            <span class="footer-divider" aria-hidden="true">·</span>
            <span>C11 → WebAssembly</span>
        </footer>
    </div>

    <script>
        var Module = {
            inputResolve: null,
            preRun: [],
            postRun: [],
            print: function(text) {
                var output = document.getElementById('output');
                if (output) {
                    output.value += text + '\n';
                    output.scrollTop = output.scrollHeight;
                }
            },
            printErr: function(text) {
                var output = document.getElementById('output');
                if (output) {
                    output.value += '[ERR] ' + text + '\n';
                    output.scrollTop = output.scrollHeight;
                }
                console.warn('WASM STDERR:', text);
            },
            locateFile: function(path) {
                return path;
            }
        };

        document.addEventListener('DOMContentLoaded', function() {
            var inputEl = document.getElementById('input');
            var outputEl = document.getElementById('output');

            inputEl.addEventListener('keydown', function(event) {
                if (event.key !== 'Enter') return;

                var text = inputEl.value;
                outputEl.value += '>_ ' + text + '\n';
                outputEl.scrollTop = outputEl.scrollHeight;
                inputEl.value = '';

                if (Module.inputResolve) {
                    var resolve = Module.inputResolve;
                    Module.inputResolve = null;
                    resolve(text);
                }
            });

            document.getElementById('terminal-area').addEventListener('click', function() {
                inputEl.focus();
            });
        });
    </script>
    {{{ SCRIPT }}}
</body>
</html>
